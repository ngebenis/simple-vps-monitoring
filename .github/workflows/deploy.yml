name: Deploy Simple VPS Monitor System to Docker VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Tentukan direktori proyek
            TARGET_DIR="/var/www/html/vps-monitor"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # 2. Update kode dari GitHub
            if [ ! -d ".git" ]; then
              # Jika folder baru, clone langsung dari repo simple-vps-monitoring
              git clone https://github.com/ngebenis/simple-vps-monitoring.git .
            else
              # Jika folder sudah ada, pastikan remote URL-nya benar
              git remote set-url origin https://github.com/ngebenis/simple-vps-monitoring.git
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # 3. Build Docker Image
            # Kita beri nama image 'vps-monitor-app'
            docker build -t vps-monitor-app .

            # 4. Jalankan Kontainer
            # Hentikan dan hapus kontainer lama jika ada
            docker stop vps-monitor-container || true
            docker rm vps-monitor-container || true

            # Jalankan kontainer baru
            # -d: background mode
            # -p: mapping port VPS 3000 ke port container 3000
            # --restart always: otomatis jalan jika VPS reboot
            docker run -d \
              --name vps-monitor-container \
              -p 3000:3000 \
              --restart always \
              vps-monitor-app